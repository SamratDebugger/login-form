<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://kit.fontawesome.com/0b45d263ce.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <form>
            <h1>Login</h1>
            <div class="common">
                <input type="email" name="email" placeholder="Enter your Email" required id="email"><i
                    class="fa-regular fa-user"></i>
            </div>
            <div class="common">
                <input type="password" name="password" placeholder="Enter your Password " required id="password"><i
                    class="fa-regular fa-eye"></i>
            </div>

            <div class="forgot">
                <div>
                    <input type="checkbox" name="remember" id="remember">
                    <label for="remember">Remember Me</label>
                </div><a href="#">Forgot Password?</a>
            </div>

            <button class="login-btn">Login</button>
            <p>Don't have account? <a href="#">Register Now</a></p>
        </form>
    </div>


    <script src="./script.js"></script>
</body>

</html>
